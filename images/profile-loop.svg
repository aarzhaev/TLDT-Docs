<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"><rect width="1000" height="360" rx="32" fill="#171719"/><g font-family="Arial,sans-serif" fill="#fff"><text x="64" y="72" font-size="28" font-weight="700">A clear path from profile to conversation</text><g transform="translate(64 125)"><circle cx="42" cy="42" r="42" fill="#f05a24"/><text x="30" y="50" font-size="24" font-weight="700">1</text><text x="100" y="36" font-size="21" font-weight="700">Publish Memory</text><text x="100" y="66" font-size="16" fill="#b8b8be">Choose the facts and voice you stand behind.</text></g><path d="M500 166h90" stroke="#777" stroke-width="3"/><path d="m580 154 20 12-20 12" fill="none" stroke="#777" stroke-width="3"/><g transform="translate(600 125)"><circle cx="42" cy="42" r="42" fill="#1687ee"/><text x="30" y="50" font-size="24" font-weight="700">2</text><text x="100" y="36" font-size="21" font-weight="700">Invite a visitor</text><text x="100" y="66" font-size="16" fill="#b8b8be">Share your username or a saved view.</text></g><path d="M500 278h90" stroke="#777" stroke-width="3"/><path d="m580 266 20 12-20 12" fill="none" stroke="#777" stroke-width="3"/><g transform="translate(64 237)"><circle cx="42" cy="42" r="42" fill="#fff"/><text x="30" y="50" font-size="24" font-weight="700" fill="#171719">3</text><text x="100" y="36" font-size="21" font-weight="700">Use the right next step</text><text x="100" y="66" font-size="16" fill="#b8b8be">Chat, fit check, meeting offer, or owner review.</text></g></g></svg>

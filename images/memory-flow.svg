<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"><rect width="1200" height="420" rx="32" fill="#f2f2f4"/><g font-family="Arial,sans-serif"><g transform="translate(70 94)"><rect width="230" height="210" rx="24" fill="#fff" stroke="#ddd"/><text x="28" y="52" font-size="24" font-weight="700" fill="#171719">Raw</text><text x="28" y="92" font-size="17" fill="#68686f">Your evidence</text><text x="28" y="130" font-size="15" fill="#68686f">CVs, notes, transcripts,</text><text x="28" y="155" font-size="15" fill="#68686f">dates and source material</text></g><path d="M325 199h90" stroke="#f05a24" stroke-width="6" stroke-linecap="round"/><path d="m400 178 25 21-25 21" fill="none" stroke="#f05a24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(485 94)"><rect width="230" height="210" rx="24" fill="#fff" stroke="#ddd"/><text x="28" y="52" font-size="24" font-weight="700" fill="#171719">Derived</text><text x="28" y="92" font-size="17" fill="#68686f">Reviewed summaries</text><text x="28" y="130" font-size="15" fill="#68686f">Organized context linked</text><text x="28" y="155" font-size="15" fill="#68686f">back to Raw evidence</text></g><path d="M740 199h90" stroke="#1687ee" stroke-width="6" stroke-linecap="round"/><path d="m815 178 25 21-25 21" fill="none" stroke="#1687ee" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(905 94)"><rect width="230" height="210" rx="24" fill="#fff" stroke="#ddd"/><text x="28" y="52" font-size="24" font-weight="700" fill="#171719">Published</text><text x="28" y="92" font-size="17" fill="#68686f">What visitors can use</text><text x="28" y="130" font-size="15" fill="#68686f">An immutable version powers</text><text x="28" y="155" font-size="15" fill="#68686f">the public profile</text></g><text x="70" y="370" font-size="16" fill="#68686f">Draft edits never change the live profile until you publish and activate a version.</text></g></svg>
